# Parameterisasi fabric-cicd: nilai yang diganti saat deploy ke workspace target.
# Key environment (TEST, PROD) harus sama dengan argumen --environment di .deploy/deploy.py.
# Dokumentasi: https://microsoft.github.io/fabric-cicd/latest/how_to/parameterization/

find_replace:
  # Default lakehouse di SarailmaxNB masih menunjuk ke ID SarailmaxLH di workspace Dev.
  - find_value: "3dda0e8a-200c-40f8-a30a-f39f4b379e13"
    replace_value:
      TEST: "$items.Lakehouse.SarailmaxLH.$id"
      PROD: "$items.Lakehouse.SarailmaxLH.$id"
    item_type: "Notebook"
    item_name: "SarailmaxNB"

  # Workspace pemilik default lakehouse di SarailmaxNB (workspace Dev).
  - find_value: "71b0c63f-dce5-4925-879e-cb17b2a8a29e"
    replace_value:
      TEST: "$workspace.$id"
      PROD: "$workspace.$id"
    item_type: "Notebook"
    item_name: "SarailmaxNB"
